[workspace]
resolver = "2"
members = [
    "common/sysfs",
    "libs/blkid",
    "libs/fdisk",
    "libs/mount",
    "libs/smartcols",
    "libs/uuid",
    "multicall",
    "tools/disk/*",
    "tools/login/*",
    "tools/misc/*",
    "tools/sched/*",
    "tools/system/*",
    "tools/term/*",
    "tools/text/*",
    "util/mangen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rustutils/linuxutils"

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
libc = "0.2"
predicates = "3"
tempfile = "3"
cols = { version = "0.3.0", git = "https://gitlab.com/rustutils/cols", features = ["color", "regex"] }
rustix = { version = "1", features = ["event", "fs", "mount", "process", "termios", "thread", "time"] }
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }

# workspace crates
linuxutils-common-sysfs = { path = "common/sysfs" }
linuxutils-libsmartcols = { path = "libs/smartcols" }
linuxutils-cal = { path = "tools/misc/cal" }
linuxutils-choom = { path = "tools/system/choom" }
linuxutils-chrt = { path = "tools/sched/chrt" }
linuxutils-fallocate = { path = "tools/system/fallocate" }
linuxutils-flock = { path = "tools/system/flock" }
linuxutils-colrm = { path = "tools/text/colrm" }
linuxutils-dmesg = { path = "tools/system/dmesg" }
linuxutils-column = { path = "tools/text/column" }
linuxutils-getopt = { path = "tools/misc/getopt" }
linuxutils-hexdump = { path = "tools/text/hexdump" }
linuxutils-ionice = { path = "tools/sched/ionice" }
linuxutils-isosize = { path = "tools/disk/isosize" }
linuxutils-kill = { path = "tools/misc/kill" }
linuxutils-line = { path = "tools/text/line" }
linuxutils-logger = { path = "tools/misc/logger" }
linuxutils-look = { path = "tools/misc/look" }
linuxutils-lslocks = { path = "tools/misc/lslocks" }
linuxutils-mcookie = { path = "tools/misc/mcookie" }
linuxutils-mesg = { path = "tools/term/mesg" }
linuxutils-namei = { path = "tools/misc/namei" }
linuxutils-mountpoint = { path = "tools/system/mountpoint" }
linuxutils-nologin = { path = "tools/login/nologin" }
linuxutils-nsenter = { path = "tools/system/nsenter" }
linuxutils-prlimit = { path = "tools/system/prlimit" }
linuxutils-rename = { path = "tools/misc/rename" }
linuxutils-renice = { path = "tools/system/renice" }
linuxutils-rev = { path = "tools/text/rev" }
linuxutils-setpgid = { path = "tools/system/setpgid" }
linuxutils-setsid = { path = "tools/system/setsid" }
linuxutils-unshare = { path = "tools/system/unshare" }
linuxutils-uuidgen = { path = "tools/misc/uuidgen" }
linuxutils-lsirq = { path = "tools/system/lsirq" }
linuxutils-lsmem = { path = "tools/system/lsmem" }
linuxutils-lsns = { path = "tools/system/lsns" }
linuxutils-rfkill = { path = "tools/system/rfkill" }
linuxutils-uuidparse = { path = "tools/misc/uuidparse" }
linuxutils-taskset = { path = "tools/sched/taskset" }
linuxutils-waitpid = { path = "tools/misc/waitpid" }
linuxutils-whereis = { path = "tools/misc/whereis" }

[workspace.metadata.crane]
name = "linuxutils-multicall"
