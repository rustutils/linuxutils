[workspace]
resolver = "2"
members = [
    "common/sysfs",
    "libs/blkid",
    "libs/fdisk",
    "libs/mount",
    "libs/smartcols",
    "libs/uuid",
    "multicall",
    "tools/login/nologin",
    "tools/misc/cal",
    "tools/misc/look",
    "tools/misc/mcookie",
    "tools/misc/uuidgen",
    "tools/misc/uuidparse",
    "tools/misc/waitpid",
    "tools/system/flock",
    "tools/system/lsirq",
    "tools/system/lsmem",
    "tools/system/lsns",
    "tools/system/mountpoint",
    "tools/system/prlimit",
    "tools/system/rfkill",
    "tools/system/setpgid",
    "tools/system/setsid",
    "tools/term/mesg",
    "tools/text/colrm",
    "tools/text/hexdump",
    "tools/text/line",
    "tools/text/rev",
    "util/mangen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rustutils/util-linux"

[workspace.dependencies]
rustix = { version = "1", features = ["event", "fs", "process", "termios"] }
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }

# workspace crates
rustutils-common-sysfs = { path = "common/sysfs" }
rustutils-libsmartcols = { path = "libs/smartcols" }
rustutils-cal = { path = "tools/misc/cal" }
rustutils-flock = { path = "tools/system/flock" }
rustutils-colrm = { path = "tools/text/colrm" }
rustutils-hexdump = { path = "tools/text/hexdump" }
rustutils-line = { path = "tools/text/line" }
rustutils-look = { path = "tools/misc/look" }
rustutils-mcookie = { path = "tools/misc/mcookie" }
rustutils-mesg = { path = "tools/term/mesg" }
rustutils-mountpoint = { path = "tools/system/mountpoint" }
rustutils-nologin = { path = "tools/login/nologin" }
rustutils-prlimit = { path = "tools/system/prlimit" }
rustutils-rev = { path = "tools/text/rev" }
rustutils-setpgid = { path = "tools/system/setpgid" }
rustutils-setsid = { path = "tools/system/setsid" }
rustutils-uuidgen = { path = "tools/misc/uuidgen" }
rustutils-lsirq = { path = "tools/system/lsirq" }
rustutils-lsmem = { path = "tools/system/lsmem" }
rustutils-lsns = { path = "tools/system/lsns" }
rustutils-rfkill = { path = "tools/system/rfkill" }
rustutils-uuidparse = { path = "tools/misc/uuidparse" }
rustutils-waitpid = { path = "tools/misc/waitpid" }

[workspace.metadata.crane]
name = "rustutils-util-linux"
