[workspace]
resolver = "2"
members = [
    "common/sysfs",
    "disk",
    "libs/blkid",
    "libs/fdisk",
    "libs/mount",
    "libs/smartcols",
    "libs/uuid",
    "login",
    "misc",
    "multicall",
    "sched",
    "system",
    "term",
    "text",
    "util/mangen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rustutils/linuxutils"

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
libc = "0.2"
predicates = "3"
procfs = { version = "0.18", default-features = false, features = ["flate2"] }
tempfile = "3"
cols = { version = "0.3.0", git = "https://gitlab.com/rustutils/cols", features = ["color", "derive", "regex"] }
rustix = { version = "1", features = ["event", "fs", "mount", "process", "termios", "thread", "time"] }
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }

# workspace crates
linuxutils-common-sysfs = { path = "common/sysfs" }
linuxutils-libsmartcols = { path = "libs/smartcols" }
linuxutils-disk = { path = "disk" }
linuxutils-login = { path = "login" }
linuxutils-misc = { path = "misc" }
linuxutils-sched = { path = "sched" }
linuxutils-system = { path = "system" }
linuxutils-term = { path = "term" }
linuxutils-text = { path = "text" }

[workspace.metadata.crane]
name = "linuxutils-multicall"
