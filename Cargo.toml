[workspace]
resolver = "2"
members = [
    "multicall",
    "tools/line",
    "tools/mcookie",
    "tools/nologin",
    "tools/rev",
    "util/mangen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rustutils/util-linux"

[workspace.metadata.crane]
name = "rustutils-util-linux"
