[workspace]
resolver = "2"
members = [
    "multicall",
    "tools/colrm",
    "tools/line",
    "tools/look",
    "tools/mcookie",
    "tools/mesg",
    "tools/nologin",
    "tools/rev",
    "util/mangen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rustutils/util-linux"

[workspace.dependencies]
rustix = { version = "1", features = ["fs", "termios"] }

[workspace.metadata.crane]
name = "rustutils-util-linux"
