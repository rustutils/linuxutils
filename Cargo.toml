[workspace]
resolver = "2"
members = [
    "common",
    "disk",
    "libs/blkid",
    "libs/fdisk",
    "libs/mount",
    "libs/smartcols",
    "libs/uuid",
    "login",
    "misc",
    "linuxutils",
    "sched",
    "system",
    "term",
    "text",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rustutils/linuxutils"
authors = ["Patrick Elsen <pelsen@xfbs.net>"]

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
insta = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
colored = "3"
libc = "0.2"
predicates = "3"
procfs = { version = "0.18", default-features = false, features = ["flate2"] }
tempfile = "3"
cols = { version = "0.3.2", features = ["color", "derive", "regex"] }
rustix = { version = "1", features = ["event", "fs", "mount", "process", "termios", "thread", "time"] }
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }

# workspace crates
linuxutils-common = { path = "common", version = "0.1.0" }
linuxutils-disk = { path = "disk", version = "0.1.0" }
linuxutils-login = { path = "login", version = "0.1.0" }
linuxutils-misc = { path = "misc", version = "0.1.0" }
linuxutils-sched = { path = "sched", version = "0.1.0" }
linuxutils-system = { path = "system", version = "0.1.0" }
linuxutils-term = { path = "term", version = "0.1.0" }
linuxutils-text = { path = "text", version = "0.1.0" }

[workspace.metadata.crane]
name = "linuxutils"
