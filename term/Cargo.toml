[package]
name = "linuxutils-term"
description = "Terminal utilities from linuxutils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["linux", "cli", "util-linux", "terminal"]
categories = ["command-line-utilities", "os::linux-apis"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
all-features = true

[features]
default = ["full"]
full = ["mesg", "wall", "write"]
mesg = ["dep:rustix"]
wall = ["dep:chrono", "dep:libc"]
write = ["dep:chrono", "dep:libc"]

[dependencies]
clap = { workspace = true }
linuxutils-common = { workspace = true }
chrono = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }

[[bin]]
name = "mesg"
path = "src/bin/mesg.rs"
required-features = ["mesg"]

[[bin]]
name = "wall"
path = "src/bin/wall.rs"
required-features = ["wall"]

[[bin]]
name = "write"
path = "src/bin/write.rs"
required-features = ["write"]
