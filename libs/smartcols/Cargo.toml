[package]
name = "rustutils-libsmartcols"
description = "ABI-compatible libsmartcols implementation for tabular data formatting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "smartcols"
crate-type = ["cdylib", "rlib"]

[dependencies]
bitflags = "2"
libc = "0.2"
regex = "1"
unicode-width = "0.2"

[build-dependencies]
bindgen = "0.71"

[dev-dependencies]
cc = "1"
tempfile = "3"
