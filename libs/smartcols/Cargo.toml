[package]
name = "linuxutils-libsmartcols"
description = "ABI-compatible libsmartcols FFI wrapper around the cols crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
nightly = []

[lib]
name = "smartcols"
crate-type = ["cdylib"]

[dependencies]
bitflags = "2"
cols.workspace = true
libc = "0.2"

[build-dependencies]
bindgen = "0.71"

[dev-dependencies]
cc = "1"
serde_json = "1"
similar = "2.7.0"
tempfile = "3"
