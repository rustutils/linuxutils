[package]
name = "linuxutils-login"
description = "Login utilities from linuxutils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["linux", "cli", "util-linux", "login"]
categories = ["command-line-utilities", "os::linux-apis"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
all-features = true

[features]
default = ["full"]
full = ["nologin"]
nologin = []

[dependencies]
clap = { workspace = true }
linuxutils-common = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }

[[bin]]
name = "nologin"
path = "src/bin/nologin.rs"
required-features = ["nologin"]
