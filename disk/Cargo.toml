[package]
name = "linuxutils-disk"
description = "Disk utilities from linuxutils (blockdev, isosize)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["linux", "cli", "util-linux", "disk", "block-device"]
categories = ["command-line-utilities", "os::linux-apis", "filesystem"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
all-features = true

[features]
default = ["full"]
full = ["blockdev", "isosize"]
blockdev = ["dep:cols", "dep:libc"]
isosize = []

[dependencies]
clap = { workspace = true }
linuxutils-common = { workspace = true }
cols = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[[bin]]
name = "blockdev"
path = "src/bin/blockdev.rs"
required-features = ["blockdev"]

[[bin]]
name = "isosize"
path = "src/bin/isosize.rs"
required-features = ["isosize"]
