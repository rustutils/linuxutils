[package]
name = "linuxutils-disk"
description = "Disk and filesystem utilities from linuxutils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["linux", "cli", "util-linux", "disk", "block-device"]
categories = ["command-line-utilities", "os::linux-apis", "filesystem"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
all-features = true

[features]
default = ["full"]
full = ["blockdev", "isosize", "mount", "umount"]
blockdev = ["dep:cols", "dep:libc"]
isosize = []
mount = ["dep:cols", "dep:linuxutils-blkid", "dep:linuxutils-mount"]
umount = ["dep:linuxutils-blkid", "dep:linuxutils-mount"]

[dependencies]
clap = { workspace = true }
linuxutils-common = { workspace = true }
cols = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
linuxutils-blkid = { workspace = true, optional = true }
linuxutils-mount = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }

[[bin]]
name = "blockdev"
path = "src/bin/blockdev.rs"
required-features = ["blockdev"]

[[bin]]
name = "isosize"
path = "src/bin/isosize.rs"
required-features = ["isosize"]

[[bin]]
name = "mount"
path = "src/bin/mount.rs"
required-features = ["mount"]

[[bin]]
name = "umount"
path = "src/bin/umount.rs"
required-features = ["umount"]
