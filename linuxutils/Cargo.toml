[package]
name = "linuxutils"
description = "Multicall binary that dispatches to every linuxutils tool by argv[0]"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["linux", "cli", "util-linux", "multicall"]
categories = ["command-line-utilities", "os::linux-apis"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
all-features = true

[[bin]]
name = "linuxutils"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
linuxutils-disk.workspace = true
linuxutils-login.workspace = true
linuxutils-misc.workspace = true
linuxutils-sched.workspace = true
linuxutils-system.workspace = true
linuxutils-term.workspace = true
linuxutils-text.workspace = true
