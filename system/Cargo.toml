[package]
name = "linuxutils-system"
description = "System utilities from linuxutils"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["full"]
full = [
    "blkdiscard",
    "choom",
    "ctrlaltdel",
    "dmesg",
    "eject",
    "fadvise",
    "fallocate",
    "flock",
    "fsfreeze",
    "fstrim",
    "ipcmk",
    "ipcrm",
    "ipcs",
    "losetup",
    "lscpu",
    "lsipc",
    "lsirq",
    "lsmem",
    "lsns",
    "mountpoint",
    "nsenter",
    "pipesz",
    "pivot_root",
    "prlimit",
    "renice",
    "rfkill",
    "setpgid",
    "setsid",
    "swapoff",
    "swapon",
    "unshare",
]
blkdiscard = ["dep:libc"]
choom = []
ctrlaltdel = []
dmesg = ["dep:chrono", "dep:colored", "dep:rustix"]
eject = ["dep:libc"]
fadvise = ["dep:rustix"]
fallocate = ["dep:rustix"]
flock = ["dep:rustix"]
fsfreeze = ["dep:libc"]
fstrim = ["dep:libc"]
ipcmk = ["dep:libc"]
ipcrm = ["dep:libc"]
ipcs = []
losetup = ["dep:cols", "dep:libc"]
lscpu = ["dep:cols", "dep:procfs"]
lsipc = ["dep:cols"]
lsirq = ["dep:cols"]
lsmem = ["dep:cols"]
lsns = ["dep:cols"]
mountpoint = ["dep:rustix"]
nsenter = ["dep:libc", "dep:rustix"]
pipesz = ["dep:libc"]
pivot_root = ["dep:rustix"]
prlimit = ["dep:cols", "dep:rustix"]
renice = ["dep:libc", "dep:rustix"]
rfkill = ["dep:cols"]
setpgid = ["dep:libc", "dep:rustix"]
setsid = ["dep:libc", "dep:rustix"]
swapoff = ["dep:libc"]
swapon = ["dep:cols", "dep:libc"]
unshare = ["dep:libc", "dep:rustix"]

[dependencies]
clap = { workspace = true }
chrono = { workspace = true, optional = true }
cols = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
procfs = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "blkdiscard"
path = "src/bin/blkdiscard.rs"
required-features = ["blkdiscard"]

