[package]
name = "rustutils-uuidgen"
description = "Create a new UUID value"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "uuidgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
uuid.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
