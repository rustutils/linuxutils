[package]
name = "rustutils-chrt"
description = "Manipulate the real-time attributes of a process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rustutils_chrt"

[[bin]]
name = "chrt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
