[package]
name = "linuxutils-sched"
description = "Scheduling utilities from linuxutils (chrt, ionice, taskset)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["linux", "cli", "util-linux", "scheduling", "priority"]
categories = ["command-line-utilities", "os::linux-apis"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
all-features = true

[features]
default = ["full"]
full = ["chrt", "ionice", "taskset"]
chrt = ["dep:libc"]
ionice = ["dep:libc"]
taskset = ["dep:rustix"]

[dependencies]
clap = { workspace = true }
linuxutils-common = { workspace = true }
libc = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }

[[bin]]
name = "chrt"
path = "src/bin/chrt.rs"
required-features = ["chrt"]

[[bin]]
name = "ionice"
path = "src/bin/ionice.rs"
required-features = ["ionice"]

[[bin]]
name = "taskset"
path = "src/bin/taskset.rs"
required-features = ["taskset"]
