[package]
name = "rustutils-util-linux"
description = "Multicall binary for rustutils util-linux tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
rustutils-colrm = { path = "../tools/colrm" }
rustutils-line = { path = "../tools/line" }
rustutils-look = { path = "../tools/look" }
rustutils-mcookie = { path = "../tools/mcookie" }
rustutils-nologin = { path = "../tools/nologin" }
rustutils-rev = { path = "../tools/rev" }
