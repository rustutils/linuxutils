[package]
name = "rustutils-linuxutils"
description = "Multicall binary for linuxutils tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "linuxutils"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustutils-cal.workspace = true
rustutils-choom.workspace = true
rustutils-chrt.workspace = true
rustutils-colrm.workspace = true
rustutils-column.workspace = true
rustutils-fallocate.workspace = true
rustutils-flock.workspace = true
rustutils-hexdump.workspace = true
rustutils-ionice.workspace = true
rustutils-isosize.workspace = true
rustutils-line.workspace = true
rustutils-look.workspace = true
rustutils-lsirq.workspace = true
rustutils-lslocks.workspace = true
rustutils-lsmem.workspace = true
rustutils-lsns.workspace = true
rustutils-mcookie.workspace = true
rustutils-mesg.workspace = true
rustutils-namei.workspace = true
rustutils-mountpoint.workspace = true
rustutils-nologin.workspace = true
rustutils-prlimit.workspace = true
rustutils-rename.workspace = true
rustutils-renice.workspace = true
rustutils-rev.workspace = true
rustutils-rfkill.workspace = true
rustutils-setpgid.workspace = true
rustutils-setsid.workspace = true
rustutils-taskset.workspace = true
rustutils-uuidgen.workspace = true
rustutils-uuidparse.workspace = true
rustutils-waitpid.workspace = true
